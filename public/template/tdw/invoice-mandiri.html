<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Invoice TDW Mandiri</title>
<style>
  /*
   * Template Invoice TDW Mandiri: satu halaman A4. Gambar formulir jadi latar, tiap isian
   * ditempatkan dengan posisi tetap (mm dari sudut kiri atas halaman).
   * Isian ditandai dolar + kurung kurawal berisi nama (seperti pada teks di bawah) dan diganti oleh sistem;
   * ubah left/top/width/height untuk menggeser isian. Isian sebaris memakai tinggi baris yang sama
   * supaya sejajar.
   */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden;
          font-family: Helvetica, Arial, sans-serif; }
  .background { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
  .field { position: absolute; margin: 0; color: #231f20; }
  .normal { font-size: 12pt; line-height: 4.8mm; }
  .small { font-size: 10pt; line-height: 4.1mm; }
</style>
</head>
<body>
<div class="page">
  <img class="background" src="images/invoice-mandiri-background.jpg" alt="">

  <!-- Bill to / Date / Invoice # / For: sejajar kiri, gaya sama -->
  <div class="field" style="left: 32.0mm; top: 104.9mm; width: 72.3mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; font-weight: bold; color: #231f20;">${schools}</div>
  <div class="field" style="left: 32.0mm; top: 117.7mm; width: 81.8mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; font-weight: bold; color: #231f20;">${tanggal}</div>
  <div class="field" style="left: 32.0mm; top: 130.5mm; width: 81.8mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; font-weight: bold; color: #231f20;">${number_invoice}</div>
  <div class="field" style="left: 32.0mm; top: 143.2mm; width: 81.8mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; font-weight: bold; color: #231f20;">${program}</div>
  <!-- Baris barang (sebaris) -->
  <div class="field ${detail_size}" style="left: 32.0mm; top: 163.4mm; width: 61.7mm; height: 4.8mm; color: #231f20;">${detail}</div>
  <div class="field" style="left: 91.9mm; top: 163.3mm; width: 21.2mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; text-align: center; color: #231f20;">${qty}</div>
  <div class="field" style="left: 115.5mm; top: 163.3mm; width: 28.2mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; text-align: right; color: #231f20;">${price}</div>
  <div class="field" style="left: 146.1mm; top: 163.1mm; width: 33.5mm; height: 5.5mm; font-size: 13pt; line-height: 5.5mm; text-align: right; font-weight: bold; color: #231f20;">${amount}</div>
  <!-- Pajak dan total -->
  <div class="field" style="left: 146.1mm; top: 177.5mm; width: 33.5mm; height: 5.5mm; font-size: 13pt; line-height: 5.5mm; text-align: right; font-weight: bold; color: #231f20;">${ppn_amount}</div>
  <div class="field" style="left: 146.1mm; top: 188.1mm; width: 33.5mm; height: 5.5mm; font-size: 13pt; line-height: 5.5mm; text-align: right; font-weight: bold; color: #231f20;">${pph_amount}</div>
  <div class="field" style="left: 146.1mm; top: 197.6mm; width: 33.5mm; height: 5.9mm; font-size: 14pt; line-height: 5.9mm; text-align: right; font-weight: bold; color: #231f20;">${total_invoice}</div>
</div>
</body>
</html>
