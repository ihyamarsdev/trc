<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kuitansi Edunesia</title>
<style>
  /*
   * Template Kuitansi Edunesia: satu halaman A4. Gambar formulir jadi latar, tiap isian
   * ditempatkan dengan posisi tetap (mm dari sudut kiri atas halaman).
   * Isian ditandai dolar + kurung kurawal berisi nama (seperti pada teks di bawah) dan diganti oleh sistem;
   * ubah left/top/width/height untuk menggeser isian.
   */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden;
          font-family: Helvetica, Arial, sans-serif; line-height: 1.2; }
  .background { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
  .field { position: absolute; margin: 0; font-weight: bold; color: #000; }
</style>
</head>
<body>
<div class="page">
  <img class="background" src="images/kuitansi-background.jpg" alt="">

  <!-- Telah diterima dari -->
  <div class="field" style="left: 14.8mm; top: 39.7mm; width: 134.0mm; height: 5.5mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 14.4mm; top: 54.8mm; width: 134.4mm; height: 6.8mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${totalSpell}</div>
  <!-- Guna pembayaran -->
  <div class="field" style="left: 15.3mm; top: 69.1mm; width: 134.8mm; height: 14.3mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${detail}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field" style="left: 57.7mm; top: 91.5mm; width: 92.5mm; height: 6.1mm; padding: 0.0mm 2.5mm; font-size: 12pt;">Rp${total},00</div>
  <!-- Tanggal -->
  <div class="field" style="left: 175.0mm; top: 103.0mm; width: 34.8mm; height: 4.7mm; padding: 0.0mm 2.5mm; font-size: 8pt;">${tanggal}</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field" style="left: 47.1mm; top: 128.9mm; width: 49.8mm; height: 13.2mm; padding: 0.0mm 2.5mm; font-size: 8pt; text-align: center;">${principal}</div>
  <!-- Telah diterima dari -->
  <div class="field" style="left: 14.2mm; top: 188.3mm; width: 134.0mm; height: 5.5mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 14.1mm; top: 202.9mm; width: 134.4mm; height: 6.8mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${totalSpell}</div>
  <!-- Guna pembayaran -->
  <div class="field" style="left: 14.1mm; top: 216.9mm; width: 134.8mm; height: 14.3mm; padding: 0.0mm 2.5mm; font-size: 12pt;">${detail}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field" style="left: 57.8mm; top: 240.0mm; width: 92.5mm; height: 6.1mm; padding: 0.0mm 2.5mm; font-size: 12pt;">Rp${total},00</div>
  <!-- Tanggal -->
  <div class="field" style="left: 174.8mm; top: 251.1mm; width: 34.8mm; height: 4.7mm; padding: 0.0mm 2.5mm; font-size: 8pt;">${tanggal}</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field" style="left: 46.6mm; top: 275.9mm; width: 51.2mm; height: 13.2mm; padding: 0.0mm 2.5mm; font-size: 8pt; text-align: center;">${principal}</div>
</div>
</body>
</html>
