<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kuitansi Edunesia</title>
<style>
  /*
   * Template Kuitansi Edunesia: satu halaman A4 berisi dua lembar kuitansi (atas dan bawah).
   * Gambar formulir jadi latar, tiap isian ditempatkan dengan posisi tetap (mm dari sudut kiri atas halaman).
   * Isian ditandai dolar + kurung kurawal berisi nama (seperti pada teks di bawah) dan diganti oleh sistem;
   * ubah left/top/width/height untuk menggeser isian.
   * Blok `.cover` menutup nama "Chief Executive Officer" pada gambar latar, diganti Direktur.
   */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden;
          font-family: Helvetica, Arial, sans-serif; line-height: 1.2; }
  .background { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
  .field { position: absolute; margin: 0; font-weight: bold; color: #000; font-size: 11pt; }
  .amount { font-size: 12pt; }
  .date { font-size: 9pt; font-weight: normal; white-space: nowrap; }
  .sign { font-size: 9pt; text-align: center; }
  .cover { position: absolute; background: #fff; }
</style>
</head>
<body>
<div class="page">
  <img class="background" src="images/kuitansi-background.jpg" alt="">

  <!-- Lembar atas -->
  <!-- Telah diterima dari -->
  <div class="field" style="left: 14.8mm; top: 39.7mm; width: 134.0mm; height: 5.5mm; padding: 0 2.5mm;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 14.4mm; top: 54.8mm; width: 134.4mm; height: 6.8mm; padding: 0 2.5mm;">${totalSpell}</div>
  <!-- Guna pembayaran -->
  <div class="field" style="left: 15.3mm; top: 69.1mm; width: 134.8mm; height: 14.3mm; padding: 0 2.5mm;">${detail}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field amount" style="left: 57.7mm; top: 91.5mm; width: 92.5mm; height: 6.1mm; padding: 0 2.5mm;">Rp${total},-</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field sign" style="left: 47.1mm; top: 128.4mm; width: 49.8mm; height: 13.2mm; padding: 0 2.5mm;">${principal}</div>
  <!-- Tanggal -->
  <div class="field date" style="left: 175.0mm; top: 103.0mm; width: 34.8mm; height: 4.7mm; padding: 0 2.5mm;">${tanggal}</div>
  <div class="cover" style="left: 154.0mm; top: 107.2mm; width: 44.0mm; height: 6.0mm;"></div>
  <div class="cover" style="left: 153.0mm; top: 128.6mm; width: 46.0mm; height: 6.0mm;"></div>
  <!-- Direktur -->
  <div class="field sign" style="left: 154.0mm; top: 108.0mm; width: 44.0mm; height: 5.0mm;">Direktur</div>
  <div class="field sign" style="left: 154.0mm; top: 129.2mm; width: 44.0mm; height: 5.0mm;">Teguh Riyanto</div>

  <!-- Lembar bawah -->
  <!-- Telah diterima dari -->
  <div class="field" style="left: 14.2mm; top: 188.3mm; width: 134.0mm; height: 5.5mm; padding: 0 2.5mm;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 14.1mm; top: 202.9mm; width: 134.4mm; height: 6.8mm; padding: 0 2.5mm;">${totalSpell}</div>
  <!-- Guna pembayaran -->
  <div class="field" style="left: 14.1mm; top: 216.9mm; width: 134.8mm; height: 14.3mm; padding: 0 2.5mm;">${detail}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field amount" style="left: 57.8mm; top: 240.0mm; width: 92.5mm; height: 6.1mm; padding: 0 2.5mm;">Rp${total},-</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field sign" style="left: 46.6mm; top: 276.9mm; width: 51.2mm; height: 13.2mm; padding: 0 2.5mm;">${principal}</div>
  <!-- Tanggal -->
  <div class="field date" style="left: 174.8mm; top: 251.1mm; width: 34.8mm; height: 4.7mm; padding: 0 2.5mm;">${tanggal}</div>
  <div class="cover" style="left: 154.0mm; top: 255.7mm; width: 44.0mm; height: 6.0mm;"></div>
  <div class="cover" style="left: 153.0mm; top: 277.1mm; width: 46.0mm; height: 6.0mm;"></div>
  <!-- Direktur -->
  <div class="field sign" style="left: 154.0mm; top: 256.5mm; width: 44.0mm; height: 5.0mm;">Direktur</div>
  <div class="field sign" style="left: 154.0mm; top: 277.7mm; width: 44.0mm; height: 5.0mm;">Teguh Riyanto</div>
</div>
</body>
</html>
