<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Invoice Edunesia</title>
<style>
  /*
   * Template Invoice Edunesia: satu halaman A4. Gambar formulir jadi latar, tiap isian
   * ditempatkan dengan posisi tetap (mm dari sudut kiri atas halaman).
   * Isian ditandai dolar + kurung kurawal berisi nama (seperti pada teks di bawah) dan diganti oleh sistem;
   * ubah left/top/width/height untuk menggeser isian. Isian sebaris memakai tinggi baris yang sama
   * supaya sejajar.
   */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden;
          font-family: Helvetica, Arial, sans-serif; }
  .background { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; }
  .field { position: absolute; margin: 0; color: #000; }
  .normal { font-size: 10.5pt; line-height: 4.4mm; }
  .small { font-size: 8.5pt; line-height: 3.7mm; }
</style>
</head>
<body>
<div class="page">
  <img class="background" src="images/invoice-background.jpg" alt="">

  <!-- Bill to -->
  <div class="field" style="left: 70.9mm; top: 99.1mm; width: 67.0mm; height: 6.2mm; font-size: 14.6pt; line-height: 6.2mm; font-weight: bold;">${schools}</div>
  <!-- Date / Invoice # / For: rata kanan, sejajar dengan labelnya -->
  <div class="field" style="left: 128.4mm; top: 97.6mm; width: 45.9mm; height: 5.5mm; font-size: 13pt; line-height: 5.5mm; text-align: right; font-weight: bold;">${tanggal}</div>
  <div class="field" style="left: 128.4mm; top: 109.4mm; width: 45.9mm; height: 5.5mm; font-size: 13pt; line-height: 5.5mm; text-align: right; font-weight: bold;">${number_invoice}</div>
  <div class="field" style="left: 107.3mm; top: 129.3mm; width: 67.0mm; height: 5.9mm; font-size: 14pt; line-height: 5.9mm; text-align: right; font-weight: bold;">${program}</div>
  <!-- Baris barang: semua di tengah baris (tinggi 419,5 - 458,5 pt) -->
  <table style="position: absolute; left: 76.2mm; top: 148.0mm; width: 39.5mm; border-collapse: collapse; table-layout: fixed;"><tr><td class="${detail_size}" style="height: 13.8mm; padding: 0; text-align: left; vertical-align: middle;">${detail}</td></tr></table>
  <div class="field" style="left: 117.1mm; top: 152.2mm; width: 14.1mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; text-align: center; font-weight: bold;">${qty}</div>
  <div class="field" style="left: 131.2mm; top: 152.2mm; width: 17.6mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; text-align: center; font-weight: bold;">${price}</div>
  <div class="field" style="left: 150.6mm; top: 152.2mm; width: 22.6mm; height: 5.1mm; font-size: 12pt; line-height: 5.1mm; text-align: center; font-weight: bold;">${amount}</div>
  <!-- Pajak dan total -->
  <div class="field" style="left: 146.2mm; top: 181.1mm; width: 24.7mm; height: 6.4mm; font-size: 15pt; line-height: 6.4mm; text-align: right; font-weight: bold;">${ppn_amount}</div>
  <div class="field" style="left: 146.2mm; top: 196.8mm; width: 24.7mm; height: 6.4mm; font-size: 15pt; line-height: 6.4mm; text-align: right; font-weight: bold;">${pph_amount}</div>
  <div class="field" style="left: 146.2mm; top: 210.3mm; width: 24.7mm; height: 6.4mm; font-size: 15pt; line-height: 6.4mm; text-align: right; font-weight: bold;">${total_invoice}</div>
</div>
</body>
</html>
