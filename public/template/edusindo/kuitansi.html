<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kuitansi Edusindo</title>
<style>
  /*
   * Template Kuitansi Edusindo: satu halaman A4 berisi dua lembar kuitansi (atas dan bawah).
   * Gambar formulir jadi latar, tiap isian ditempatkan dengan posisi tetap (mm dari sudut kiri atas halaman).
   * Isian ditandai dolar + kurung kurawal berisi nama (seperti pada teks di bawah) dan diganti oleh sistem;
   * ubah left/top/width/height untuk menggeser isian.
   */
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden;
          font-family: "Times New Roman", Times, serif; line-height: 1.2; }
  .background { position: absolute; left: 0; width: 210mm; height: 107.5mm; }
  .field { position: absolute; margin: 0; color: #000; font-size: 11pt; }
  .small { font-size: 9pt; white-space: nowrap; }
  .name { font-size: 10pt; font-weight: bold; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <!-- Lembar atas -->
  <img class="background" style="top: 6mm;" src="images/kuitansi-background.png" alt="">

  <!-- No -->
  <div class="field" style="left: 40.2mm; top: 19.1mm; width: 60.0mm; height: 5.0mm; font: bold 12pt/5.0mm Helvetica, Arial, sans-serif;">${number}</div>
  <!-- Telah diterima dari -->
  <div class="field" style="left: 75.7mm; top: 33.8mm; width: 96.0mm; height: 5.6mm;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 75.7mm; top: 41.3mm; width: 96.0mm; height: 5.6mm; text-transform: uppercase;">${totalSpell}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field" style="left: 75.7mm; top: 48.8mm; width: 96.0mm; height: 5.6mm;">Rp ${total},-</div>
  <!-- Untuk -->
  <div class="field" style="left: 75.7mm; top: 58.4mm; width: 96.0mm; height: 9.4mm;">${qty} Pelaksanaan Program Asesmen Bakat Minat Murid Indonesia</div>
  <!-- Tanggal -->
  <div class="field small" style="left: 181.0mm; top: 75.6mm; width: 29.0mm; height: 4.0mm;">${tanggal}</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field name" style="left: 58.0mm; top: 95.5mm; width: 50.0mm; height: 8.4mm;">${principal}</div>

  <!-- Lembar bawah -->
  <img class="background" style="top: 128.7mm;" src="images/kuitansi-background.png" alt="">

  <!-- No -->
  <div class="field" style="left: 40.2mm; top: 141.8mm; width: 60.0mm; height: 5.0mm; font: bold 12pt/5.0mm Helvetica, Arial, sans-serif;">${number}</div>
  <!-- Telah diterima dari -->
  <div class="field" style="left: 75.7mm; top: 156.5mm; width: 96.0mm; height: 5.6mm;">${schools}</div>
  <!-- Uang sejumlah (dalam huruf) -->
  <div class="field" style="left: 75.7mm; top: 164.0mm; width: 96.0mm; height: 5.6mm; text-transform: uppercase;">${totalSpell}</div>
  <!-- Terbilang (dalam angka) -->
  <div class="field" style="left: 75.7mm; top: 171.5mm; width: 96.0mm; height: 5.6mm;">Rp ${total},-</div>
  <!-- Untuk -->
  <div class="field" style="left: 75.7mm; top: 181.1mm; width: 96.0mm; height: 9.4mm;">${qty} Pelaksanaan Program Asesmen Bakat Minat Murid Indonesia</div>
  <!-- Tanggal -->
  <div class="field small" style="left: 181.0mm; top: 198.3mm; width: 29.0mm; height: 4.0mm;">${tanggal}</div>
  <!-- Kepala sekolah (nama) -->
  <div class="field name" style="left: 58.0mm; top: 218.2mm; width: 50.0mm; height: 8.4mm;">${principal}</div>
</div>
</body>
</html>
